<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8FAFC" />
    <title>Offline | OurCity</title>
    <style>
      :root {
        color-scheme: light;
        --civic-bg: #F8FAFC;
        --civic-slate: #0F172A;
        --civic-border: #E2E8F0;
        --civic-blue: #1D4ED8;
        font-family: Arial, sans-serif;
        background: var(--civic-bg);
        color: var(--civic-slate);
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        max-width: 420px;
        padding: 28px;
        border: 1px solid var(--civic-border);
        border-radius: 16px;
        background: white;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        color: var(--civic-blue);
      }

      p {
        line-height: 1.6;
      }

      button {
        margin-top: 12px;
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--civic-blue);
        color: white;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Connect to the internet to use OurCity. Reports, collection tracking,
        and account features need a network connection.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
