<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176b45" />
    <title>Offline | OurCity</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
        background: #f7faf7;
        color: #17251c;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        max-width: 420px;
        padding: 28px;
        border: 1px solid #dbe5dc;
        border-radius: 16px;
        background: white;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        color: #176b45;
      }

      p {
        line-height: 1.6;
      }

      button {
        margin-top: 12px;
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #176b45;
        color: white;
        font-size: 15px;
        font-weight: 700;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #101b15;
          color: #edf4ef;
        }

        main {
          border-color: #31483a;
          background: #17251c;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Connect to the internet to use OurCity. Reports, collection tracking,
        and account features need a network connection.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
